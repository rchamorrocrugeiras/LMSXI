<body>
    <p id="cor">Este é un parágrafo de exemplo</p>
    <button onclick="cambiarCor()">Marcar en vermello</button>
</body>

<script>
    function cambiarCor() {
        let texto = document.getElementById("cor");
        texto.style.color = "red";
        texto.style.fontSize = "24px";
    } 
</script>
