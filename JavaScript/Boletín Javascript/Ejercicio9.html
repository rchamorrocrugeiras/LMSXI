<script>
    let numero1 = Number(prompt("Introduce o primeiro número: "));
    let numero2 = Number(prompt("Introduce o segundo número: "));
    let numero3 = Number(prompt("Introduce o terceiro número: "));

    let maior;

    if (numero1 >= numero2 && numero1 >= numero3) {
        maior = numero1;
    }   else if (numero2 >= numero1 && numero2 >= numero3) {
        maior = numero2;
    }   else {
        maior = numero3;
    }

    console.log("O maior é: " + maior);
</script>
